sonar.exclusions=site/analysis/**,site/dist/**,site/data/**,site/playground/*.json,site/fonts/**,build/**,dist/**
sonar.coverage.exclusions=site/**,scripts/**
sonar.python.version=3.10,3.13
sonar.python.coverage.reportPaths=coverage.xml
