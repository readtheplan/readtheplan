name: readtheplan Infrastructure Risk Gate
description: Analyze infrastructure plans and configuration with one local risk contract.
author: readtheplan maintainers

inputs:
  tool:
    description: "Input tool: terraform, terraform-config, terraform-lock, terragrunt, cloudformation, cdk, azure, bicep, kubernetes, helm, kustomize, crossplane, serverless, sam, pulumi, ansible, ansible-project, jenkins, jenkins-jcasc, chef, chef-project, puppet, puppet-project, github-actions, gitlab-ci, circleci, azure-pipelines, bitbucket-pipelines, buildkite, atlantis, docker-compose, dockerfile, nomad, packer, salt, salt-project, nix, dsc, cfengine, vagrant, cloud-init, systemd, nginx, haproxy, envoy, traefik, caddy, grafana, loki, vault, consul, prometheus, alertmanager, or otel-collector."
    required: false
    default: "terraform"
  input-file:
    description: Path to the plan, manifest, playbook, pipeline, recipe, or other supported input.
    required: false
    default: ""
  plan-file:
    description: "Deprecated Terraform-specific alias for input-file."
    required: false
    default: ""
    deprecationMessage: "Use input-file. plan-file remains supported for backward compatibility."
  framework:
    description: Optional packaged compliance framework name, such as soc2, iso27001, or hipaa.
    required: false
    default: ""
  fail-on-any-change:
    description: "Fail when the plan contains ANY resource changes (including safe ones like tag updates). Use only for strict zero-diff policies. Ignored when fail-on-threshold is set."
    required: false
    default: "false"
  fail-on-changes:
    description: "DEPRECATED — use fail-on-any-change instead. If set to 'true', behaves identically to fail-on-any-change: true. Still overridden by fail-on-threshold."
    required: false
    default: "false"
    deprecationMessage: "Use fail-on-any-change. The fail-on-changes input is deprecated and will be removed in a future release."
  fail-on-threshold:
    description: "Minimum risk tier that fails the workflow (safe, review, dangerous, irreversible). Takes precedence over both fail-on-any-change and the deprecated fail-on-changes. Empty disables all threshold gating."
    required: false
    default: ""
  python-version:
    description: Python version used to run the readtheplan CLI.
    required: false
    default: "3.11"
  install-source:
    description: Pip install source for the CLI. Defaults to this action's bundled source so action and CLI versions match. Set to readtheplan to use the latest PyPI release.
    required: false
    default: ""

outputs:
  summary-json:
    description: Full readtheplan JSON result unless it is too large for GitHub Actions outputs.
    value: ${{ steps.analyze.outputs['summary-json'] }}
  resource-change-count:
    description: Backward-compatible alias for the number of analyzed changes.
    value: ${{ steps.analyze.outputs['resource-change-count'] }}
  change-count:
    description: Number of analyzed changes.
    value: ${{ steps.analyze.outputs['resource-change-count'] }}
  action-counts:
    description: Compact JSON object of action counts.
    value: ${{ steps.analyze.outputs['action-counts'] }}
  risk-counts:
    description: Compact JSON object of risk counts.
    value: ${{ steps.analyze.outputs['risk-counts'] }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        TOOL: ${{ inputs.tool }}
        INPUT_FILE: ${{ inputs.input-file }}
        PLAN_FILE: ${{ inputs.plan-file }}
        FRAMEWORK: ${{ inputs.framework }}
        FAIL_ON_ANY_CHANGE: ${{ inputs.fail-on-any-change }}
        FAIL_ON_CHANGES: ${{ inputs.fail-on-changes }}
        FAIL_ON_THRESHOLD: ${{ inputs.fail-on-threshold }}
      run: |
        set -euo pipefail

        TOOL="${TOOL,,}"
        case "$TOOL" in
          terraform|terraform-config|terraform-lock|terragrunt|cloudformation|cdk|azure|bicep|kubernetes|helm|kustomize|crossplane|serverless|sam|pulumi|ansible|ansible-project|jenkins|jenkins-jcasc|chef|chef-project|puppet|puppet-project|github-actions|gitlab-ci|circleci|azure-pipelines|bitbucket-pipelines|buildkite|atlantis|docker-compose|dockerfile|nomad|packer|salt|salt-project|nix|dsc|cfengine|vagrant|cloud-init|systemd|nginx|haproxy|envoy|traefik|caddy|grafana|loki|vault|consul|prometheus|alertmanager|otel-collector) ;;
          *) echo "::error::unsupported tool: $TOOL"; exit 1 ;;
        esac

        if [ -n "$INPUT_FILE" ] && [ -n "$PLAN_FILE" ] && [ "$INPUT_FILE" != "$PLAN_FILE" ]; then
          echo "::error::input-file and plan-file cannot name different files"
          exit 1
        fi
        INPUT_FILE="${INPUT_FILE:-$PLAN_FILE}"
        if [ -z "$INPUT_FILE" ]; then
          echo "::error::input-file is required (plan-file remains a deprecated alias)"
          exit 1
        fi

        # Support deprecated fail-on-changes (map to fail-on-any-change)
        FAIL_ON_ANY_CHANGE="${FAIL_ON_ANY_CHANGE:-false}"
        case "${FAIL_ON_CHANGES,,}" in
          true) FAIL_ON_ANY_CHANGE="true" ;;
          false) ;;
          *) echo "::error::fail-on-changes must be true or false, got: $FAIL_ON_CHANGES"; exit 1 ;;
        esac

        if [ -n "${FAIL_ON_THRESHOLD:-}" ]; then
          case "${FAIL_ON_THRESHOLD,,}" in
            safe|review|dangerous|irreversible) ;;
            *) echo "::error::fail-on-threshold must be one of: safe, review, dangerous, irreversible, got: $FAIL_ON_THRESHOLD"; exit 1 ;;
          esac
        fi

        case "${FAIL_ON_ANY_CHANGE,,}" in
          true|false)
            ;;
          *)
            echo "::error::fail-on-any-change must be true or false, got: $FAIL_ON_ANY_CHANGE"
            exit 1
            ;;
        esac

        # Export resolved values so downstream steps don't re-read raw inputs
        echo "RESOLVED_FAIL_ON_ANY_CHANGE=$FAIL_ON_ANY_CHANGE" >> "$GITHUB_ENV"
        echo "RESOLVED_FAIL_ON_THRESHOLD=${FAIL_ON_THRESHOLD:-}" >> "$GITHUB_ENV"
        echo "RESOLVED_TOOL=$TOOL" >> "$GITHUB_ENV"
        echo "RESOLVED_INPUT_FILE=$INPUT_FILE" >> "$GITHUB_ENV"
        echo "RESOLVED_FRAMEWORK=${FRAMEWORK:-}" >> "$GITHUB_ENV"

        if [ ! -f "$INPUT_FILE" ]; then
          echo "::error::Input file not found: $INPUT_FILE"
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install readtheplan
      shell: bash
      env:
        INSTALL_SOURCE: ${{ inputs.install-source }}
      run: |
        set -euo pipefail

        if [ -n "$INSTALL_SOURCE" ]; then
          source="$INSTALL_SOURCE"
        else
          source="$GITHUB_ACTION_PATH"
        fi

        python -m pip install --upgrade pip
        python -m pip install "$source"

    - name: Analyze infrastructure input
      id: analyze
      shell: bash
      env:
        TOOL: ${{ env.RESOLVED_TOOL }}
        INPUT_FILE: ${{ env.RESOLVED_INPUT_FILE }}
        FRAMEWORK: ${{ env.RESOLVED_FRAMEWORK }}
        FAIL_ON_ANY_CHANGE: ${{ env.RESOLVED_FAIL_ON_ANY_CHANGE }}
        FAIL_ON_THRESHOLD: ${{ env.RESOLVED_FAIL_ON_THRESHOLD }}
      run: |
        set -euo pipefail

        output_file="$(mktemp)"
        error_file="$(mktemp)"
        count_file="$(mktemp)"

        if [ "$TOOL" = "terraform" ]; then
          command=(readtheplan analyze --format json)
        else
          command=(readtheplan "$TOOL")
        fi
        if [ -n "$FRAMEWORK" ]; then
          command+=(--framework "$FRAMEWORK")
        fi

        set +e
        "${command[@]}" "$INPUT_FILE" >"$output_file" 2>"$error_file"
        cli_status=$?
        set -e

        if [ ! -s "$output_file" ] || { [ "$TOOL" = "terraform" ] && [ "$cli_status" -ne 0 ]; } || [ "$cli_status" -gt 2 ]; then
          echo "::error::readtheplan failed with exit code $cli_status"
          if [ -s "$error_file" ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < "$error_file"
          fi
          exit "$cli_status"
        fi

        python "$GITHUB_ACTION_PATH/scripts/parse_action_output.py" "$output_file" "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" "$count_file"

        # Use resolved values from Validate step (already handle deprecated fail-on-changes mapping)
        FAIL_ON_ANY_CHANGE="${FAIL_ON_ANY_CHANGE:-false}"
        FAIL_ON_THRESHOLD="${FAIL_ON_THRESHOLD:-}"

        resource_change_count="$(cat "$count_file")"
        risk_counts="$(python -c "import json,sys; p=json.load(open(sys.argv[1], encoding='utf-8')); print(json.dumps(p.get('risks', p.get('risk_counts', {})), sort_keys=True, separators=(',', ':')))" "$output_file")"

        if [ -n "$FAIL_ON_THRESHOLD" ]; then
          threshold_reached=false
          for risk in safe review dangerous irreversible; do
            if [ "$risk" = "${FAIL_ON_THRESHOLD,,}" ]; then
              threshold_reached=true
            fi
            if [ "$threshold_reached" != "true" ]; then
              continue
            fi
            count=$(python -c "import sys,json; r=json.loads(sys.stdin.read()); print(r.get('$risk',0))" <<< "$risk_counts" 2>/dev/null || echo 0)
            if [ "$count" -gt 0 ]; then
              echo "::error::readtheplan found $count $risk changes (threshold: $FAIL_ON_THRESHOLD)"
              exit 1
            fi
          done
        elif [ "${FAIL_ON_ANY_CHANGE,,}" = "true" ] && [ "$resource_change_count" -gt 0 ]; then
          echo "::error::Plan contains $resource_change_count resource changes and fail-on-any-change is true"
          exit 1
        fi

branding:
  icon: file-text
  color: blue
