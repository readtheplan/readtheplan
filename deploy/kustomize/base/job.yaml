apiVersion: batch/v1
kind: Job
metadata:
  name: readtheplan-smoke
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: readtheplan-smoke
        app.kubernetes.io/part-of: readtheplan
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: readtheplan
          image: readtheplan:local
          imagePullPolicy: IfNotPresent
          args:
            - analyze
            - --format
            - json
            - /input/plan.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: input
              mountPath: /input
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: input
          configMap:
            name: readtheplan-smoke-input
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi

