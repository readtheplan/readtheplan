apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: readtheplan
resources:
  - namespace.yaml
  - network-policy.yaml
  - job.yaml
configMapGenerator:
  - name: readtheplan-smoke-input
    files:
      - plan.json=smoke-plan.json
generatorOptions:
  labels:
    app.kubernetes.io/name: readtheplan-smoke
    app.kubernetes.io/part-of: readtheplan
images:
  - name: readtheplan
    newName: readtheplan
    newTag: local

