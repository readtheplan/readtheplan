framework: soc2
framework_version: 2017-tsc
schema_version: 1
mappings:
- resource_type: "*"
  actions: ["*"]
  mapping_kind: framework_baseline
  coverage_eligible: false
  controls:
  - id: CC8.1
    title: Change Management
    rationale: Every infrastructure or delivery-system change requires authorized, tested, and traceable change management.
- resource_type: aws_kms_key
  actions:
  - create
  controls:
  - id: CC6.1
    title: Logical and Physical Access Controls
    rationale: 'Creating a customer-managed key establishes a new access boundary on the data it will protect.

      '
  - id: CC8.1
    title: Change Management
    rationale: New key material is a change-management event.
- resource_type: aws_kms_key
  actions:
  - update
  controls:
  - id: CC6.1
    title: Logical and Physical Access Controls
    rationale: 'Key policy or key spec updates change who can use the key and how.

      '
  - id: CC8.1
    title: Change Management
    rationale: Key configuration update.
- resource_type: aws_kms_key
  actions:
  - delete
  - delete/create
  - replace
  controls:
  - id: CC6.1
    title: Logical and Physical Access Controls
    rationale: 'Replacing or destroying a key changes the access boundary on every ciphertext that depended on it.

      '
  - id: CC6.7
    title: Restriction of Information Asset Movements
    rationale: 'Key destruction is irreversible for any data encrypted under it.

      '
  - id: CC8.1
    title: Change Management
    rationale: Key replacement requires change-management review.
  - id: A1.2
    title: Availability — Recovery
    rationale: 'Loss of a key without backed-up plaintext breaks recovery for encrypted data.

      '
  - id: C1.1
    title: Confidentiality — Identification and Maintenance
    rationale: Encryption key lifecycle change.
