# FedRAMP Moderate Baseline — NIST 800-53 Rev 5 control mapping.
#
# This catalog maps Terraform resource changes to the NIST 800-53
# controls required by the FedRAMP Moderate baseline. It follows
# the same conventions as SOC 2, ISO 27001, and HIPAA catalogs:
# every entry maps a resource type × action combination to the
# control IDs an assessor or compliance reviewer cares about.
#
# Mapping principles:
#   - AC (Access Control) on IAM, S3 policies, and security group changes
#   - AU (Audit and Accountability) on CloudTrail, CloudWatch, logging changes
#   - CM (Configuration Management) on every resource change
#   - CP (Contingency Planning) on data stores, availability-affecting resources
#   - IA (Identification and Authentication) on IAM lifecycle
#   - SC (System and Communications Protection) on KMS, networking, DNS
#   - SI (System and Information Integrity) on monitoring, alerting

framework: fedramp-moderate
framework_version: nist-800-53-rev5
schema_version: 1

mappings:
  - resource_type: "*"
    actions: ["*"]
    mapping_kind: framework_baseline
    coverage_eligible: false
    controls:
      - id: CM-2
        title: Baseline Configuration
        rationale: Every infrastructure or delivery-system change must preserve and document the authorized system baseline.
  # ── KMS ─────────────────────────────────────────────────────────────────
  - resource_type: aws_kms_key
    actions: [create]
    controls:
      - id: SC-12
        title: Cryptographic Key Establishment and Management
        rationale: New customer-managed key establishes cryptographic boundary.
      - id: CM-2
        title: Baseline Configuration
        rationale: New configuration item under cryptographic control.

  - resource_type: aws_kms_key
    actions: [update]
    controls:
      - id: SC-12
        title: Cryptographic Key Establishment and Management
        rationale: Key policy or spec updates change who can use the key and how.
      - id: AC-2
        title: Account Management
        rationale: Key policy is a primary authorization surface for access to encrypted data.
      - id: CM-2
        title: Baseline Configuration
        rationale: Cryptographic configuration update.

  - resource_type: aws_kms_key
    actions: [delete, "delete/create", replace]
    controls:
      - id: SC-12
        title: Cryptographic Key Establishment and Management
        rationale: >-
          Replacing or destroying a key changes the cryptographic boundary
          on every ciphertext that depended on it.
      - id: MP-6
        title: Media Sanitization
        rationale: >-
          Key destruction is final disposition of the means to read
          encrypted data — equivalent to media sanitization.
      - id: CP-9
        title: Information System Backup
        rationale: >-
          Loss of a key without backed-up plaintext breaks recovery for
          data encrypted under it.
      - id: CM-2
        title: Baseline Configuration
        rationale: Key replacement requires change-management review.

  - resource_type: aws_kms_alias
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: SC-12
        title: Cryptographic Key Establishment and Management
        rationale: Alias changes can redirect encryption to a different key.
      - id: CM-2
        title: Baseline Configuration
        rationale: Alias change.

  # ── RDS ─────────────────────────────────────────────────────────────────
  - resource_type: aws_db_instance
    actions: [create]
    controls:
      - id: CM-2
        title: Baseline Configuration
        rationale: New database instance.
      - id: CP-9
        title: Information System Backup
        rationale: New stateful component requires backup and recovery design.

  - resource_type: aws_db_instance
    actions: [update]
    controls:
      - id: AC-2
        title: Account Management
        rationale: >-
          Database parameter, master-user, or network changes affect the
          access boundary on stored data.
      - id: SC-8
        title: Transmission Confidentiality and Integrity
        rationale: >-
          Network and TLS-related parameter changes affect data in transit.
      - id: CM-2
        title: Baseline Configuration
        rationale: Database configuration update.

  - resource_type: aws_db_instance
    actions: [delete, "delete/create", replace]
    controls:
      - id: MP-6
        title: Media Sanitization
        rationale: >-
          Replacement creates a new endpoint and discards the prior
          instance and its data unless explicitly snapshotted.
      - id: CP-9
        title: Information System Backup
        rationale: >-
          Endpoint changes affect application connectivity and recovery
          procedures.
      - id: CM-2
        title: Baseline Configuration
        rationale: Database replacement.

  - resource_type: aws_rds_cluster
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: CP-9
        title: Information System Backup
        rationale: Cluster topology change affects data recovery posture.
      - id: AC-2
        title: Account Management
        rationale: Cluster lifecycle and configuration change.
      - id: CM-2
        title: Baseline Configuration
        rationale: Database cluster change.

  # ── S3 ──────────────────────────────────────────────────────────────────
  - resource_type: aws_s3_bucket
    actions: [create]
    controls:
      - id: CM-2
        title: Baseline Configuration
        rationale: New cloud storage container.

  - resource_type: aws_s3_bucket
    actions: [update]
    controls:
      - id: AC-2
        title: Account Management
        rationale: Bucket configuration changes affect data access boundary.
      - id: SC-28
        title: Protection of Information at Rest
        rationale: >-
          Encryption-at-rest, KMS-key-id, or default-encryption changes
          affect cryptographic posture.
      - id: SI-7
        title: Software, Firmware, and Information Integrity
        rationale: >-
          Versioning and object-lock changes affect data tamper-resistance.
      - id: CM-2
        title: Baseline Configuration
        rationale: Bucket configuration update.

  - resource_type: aws_s3_bucket
    actions: [delete, "delete/create", replace]
    controls:
      - id: MP-6
        title: Media Sanitization
        rationale: >-
          Bucket destruction removes its objects — equivalent to media
          sanitization under NIST 800-53.
      - id: CM-2
        title: Baseline Configuration
        rationale: Bucket replacement.

  - resource_type: aws_s3_bucket_policy
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: AC-2
        title: Account Management
        rationale: Bucket policy is the primary access-control surface for S3 data.
      - id: AC-3
        title: Access Enforcement
        rationale: >-
          Public or cross-account principals in a bucket policy expand
          the access enforcement boundary.
      - id: CM-2
        title: Baseline Configuration
        rationale: Bucket policy change.

  - resource_type: aws_s3_bucket_public_access_block
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: AC-2
        title: Account Management
        rationale: >-
          Public-access-block toggles the strictest S3 access guardrail.
      - id: AC-3
        title: Access Enforcement
        rationale: Removing the block can expose objects publicly.
      - id: CM-2
        title: Baseline Configuration
        rationale: Public-access-block change.

  # ── IAM ─────────────────────────────────────────────────────────────────
  - resource_type: aws_iam_role
    actions: [create]
    controls:
      - id: IA-2
        title: Identification and Authentication (Organizational Users)
        rationale: New IAM role establishes a new authorization context.
      - id: AC-2
        title: Account Management
        rationale: New role lifecycle event.
      - id: CM-2
        title: Baseline Configuration
        rationale: New role.

  - resource_type: aws_iam_role
    actions: [update]
    controls:
      - id: IA-2
        title: Identification and Authentication (Organizational Users)
        rationale: >-
          Trust policy or attached-policy changes can broaden who can
          assume the role.
      - id: AC-2
        title: Account Management
        rationale: >-
          Trust policy changes who can authenticate as the role.
      - id: CM-2
        title: Baseline Configuration
        rationale: Role configuration change.

  - resource_type: aws_iam_role
    actions: [delete, "delete/create", replace]
    controls:
      - id: IA-2
        title: Identification and Authentication (Organizational Users)
        rationale: Role lifecycle change affects authentication paths.
      - id: CM-2
        title: Baseline Configuration
        rationale: Role replacement.

  - resource_type: aws_iam_policy
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: AC-2
        title: Account Management
        rationale: Policy changes alter what attached principals can do.
      - id: AC-6
        title: Least Privilege
        rationale: Policies are the carrier for least-privilege enforcement.
      - id: CM-2
        title: Baseline Configuration
        rationale: Policy change.

  - resource_type: aws_iam_role_policy
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: AC-2
        title: Account Management
        rationale: Inline role policy directly affects role permissions.
      - id: AC-6
        title: Least Privilege
        rationale: Inline policy defines the least-privilege boundary.
      - id: CM-2
        title: Baseline Configuration
        rationale: Inline role policy change.

  - resource_type: aws_iam_user
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: IA-2
        title: Identification and Authentication (Organizational Users)
        rationale: IAM user lifecycle is a primary authentication event.
      - id: AC-2
        title: Account Management
        rationale: User lifecycle changes who can authenticate.
      - id: CM-2
        title: Baseline Configuration
        rationale: IAM user change.

  # ── Networking ──────────────────────────────────────────────────────────
  - resource_type: aws_security_group
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: SC-7
        title: Boundary Protection
        rationale: >-
          Security groups are the primary network-boundary control on AWS.
      - id: AC-3
        title: Access Enforcement
        rationale: SG changes adjust who can reach FedRAMP workloads.
      - id: CM-2
        title: Baseline Configuration
        rationale: Security group change.

  - resource_type: aws_security_group_rule
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: SC-7
        title: Boundary Protection
        rationale: Ingress/egress rules adjust the network boundary.
      - id: AC-3
        title: Access Enforcement
        rationale: Rule changes affect who can access workloads.
      - id: CM-2
        title: Baseline Configuration
        rationale: Security group rule change.

  - resource_type: aws_vpc_security_group_ingress_rule
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: SC-7
        title: Boundary Protection
        rationale: Ingress rules adjust who can reach workloads.
      - id: AC-3
        title: Access Enforcement
        rationale: Ingress changes affect access boundaries.
      - id: CM-2
        title: Baseline Configuration
        rationale: Ingress rule change.

  - resource_type: aws_subnet
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: SC-7
        title: Boundary Protection
        rationale: Subnets define workload placement and network reachability.
      - id: AC-3
        title: Access Enforcement
        rationale: Subnet topology affects access boundaries.
      - id: CM-2
        title: Baseline Configuration
        rationale: Subnet topology change.

  - resource_type: aws_route_table
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: SC-7
        title: Boundary Protection
        rationale: Route tables define private, public, and egress boundaries.
      - id: CM-2
        title: Baseline Configuration
        rationale: Route table change.

  - resource_type: aws_route
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: SC-7
        title: Boundary Protection
        rationale: Routes determine which network boundary traffic crosses.
      - id: CM-2
        title: Baseline Configuration
        rationale: Route change.

  - resource_type: aws_route_table_association
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: SC-7
        title: Boundary Protection
        rationale: Association changes move subnets between routing policies.
      - id: CM-2
        title: Baseline Configuration
        rationale: Route table association change.

  - resource_type: aws_nat_gateway
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: SC-7
        title: Boundary Protection
        rationale: NAT gateways govern private subnet egress.
      - id: CP-8
        title: Telecommunications Services
        rationale: NAT gateway changes can interrupt workload egress.
      - id: CM-2
        title: Baseline Configuration
        rationale: NAT gateway change.

  - resource_type: aws_internet_gateway
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: SC-7
        title: Boundary Protection
        rationale: Internet gateways expose VPC routes to the public internet.
      - id: CM-2
        title: Baseline Configuration
        rationale: Internet gateway change.

  - resource_type: aws_route53_zone
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: SC-7
        title: Boundary Protection
        rationale: Zone changes can move where production traffic resolves.
      - id: CM-2
        title: Baseline Configuration
        rationale: DNS zone change.

  - resource_type: aws_route53_record
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: SC-7
        title: Boundary Protection
        rationale: DNS record changes can redirect production traffic.
      - id: CM-2
        title: Baseline Configuration
        rationale: DNS record change.

  # ── EKS ─────────────────────────────────────────────────────────────────
  - resource_type: aws_eks_cluster
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: AC-2
        title: Account Management
        rationale: >-
          Cluster-endpoint and authentication changes affect access to
          FedRAMP workloads.
      - id: IA-2
        title: Identification and Authentication (Organizational Users)
        rationale: Cluster authentication mode changes who can authenticate.
      - id: CP-2
        title: Contingency Plan
        rationale: Cluster changes affect every workload running on it.
      - id: SC-7
        title: Boundary Protection
        rationale: Cluster network and endpoint changes adjust the boundary.
      - id: CM-2
        title: Baseline Configuration
        rationale: EKS cluster change.

  - resource_type: aws_eks_node_group
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: CP-2
        title: Contingency Plan
        rationale: Node group changes affect cluster capacity and recovery.
      - id: CM-2
        title: Baseline Configuration
        rationale: Node group lifecycle change.

  # ── Load Balancer ──────────────────────────────────────────────────────
  - resource_type: aws_lb
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: CP-2
        title: Contingency Plan
        rationale: >-
          Load balancer lifecycle changes directly affect service availability.
      - id: SC-7
        title: Boundary Protection
        rationale: >-
          Load balancer scheme and listener configuration define the network
          boundary for fronted services.
      - id: CM-2
        title: Baseline Configuration
        rationale: Load balancer change.

  - resource_type: aws_lb_listener
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: CP-2
        title: Contingency Plan
        rationale: >-
          Listener changes affect traffic routing and availability.
      - id: SC-8
        title: Transmission Confidentiality and Integrity
        rationale: >-
          Listeners define which ports and protocols are exposed for traffic.
      - id: CM-2
        title: Baseline Configuration
        rationale: Listener change.

  - resource_type: aws_lb_listener_rule
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: SC-7
        title: Boundary Protection
        rationale: Listener rule changes affect traffic routing precedence.
      - id: CM-2
        title: Baseline Configuration
        rationale: Listener rule change.

  # ── Lambda ──────────────────────────────────────────────────────────────
  - resource_type: aws_lambda_function
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: CM-2
        title: Baseline Configuration
        rationale: Lambda function lifecycle change.
      - id: SC-7
        title: Boundary Protection
        rationale: VPC and execution-role changes affect function access boundary.

  - resource_type: aws_lambda_alias
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: CM-2
        title: Baseline Configuration
        rationale: Alias change affects which function version receives traffic.

  # ── ECR ─────────────────────────────────────────────────────────────────
  - resource_type: aws_ecr_repository
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: CM-2
        title: Baseline Configuration
        rationale: Container registry configuration change.
      - id: SI-7
        title: Software, Firmware, and Information Integrity
        rationale: Image scanning and tag mutability affect container integrity.

  # ── CloudWatch / Monitoring ─────────────────────────────────────────────
  - resource_type: aws_cloudwatch_metric_alarm
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: SI-4
        title: Information System Monitoring
        rationale: Metric alarm changes affect threat detection coverage.
      - id: AU-6
        title: Audit Record Review, Analysis, and Reporting
        rationale: Alarm thresholds define when audit events escalate.
      - id: CM-2
        title: Baseline Configuration
        rationale: Monitoring configuration change.

  - resource_type: aws_cloudwatch_log_group
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: AU-4
        title: Audit Log Storage Capacity
        rationale: Log group retention and storage changes affect audit trail availability.
      - id: AU-11
        title: Audit Record Retention
        rationale: Retention policy directly controls how long audit records persist.
      - id: CM-2
        title: Baseline Configuration
        rationale: Audit log configuration change.

  - resource_type: aws_cloudwatch_event_rule
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: SI-4
        title: Information System Monitoring
        rationale: Event rules define automated detection and response paths.
      - id: CM-2
        title: Baseline Configuration
        rationale: Event rule change.

  # ── ECS ─────────────────────────────────────────────────────────────────
  - resource_type: aws_ecs_service
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: CP-2
        title: Contingency Plan
        rationale: ECS service lifecycle affects workload availability.
      - id: CM-2
        title: Baseline Configuration
        rationale: ECS service change.

  # ── SQS ─────────────────────────────────────────────────────────────────
  - resource_type: aws_sqs_queue
    actions: [create, update, delete, "delete/create", replace]
    controls:
      - id: SC-28
        title: Protection of Information at Rest
        rationale: SSE and KMS key configuration protect queued messages.
      - id: AC-3
        title: Access Enforcement
        rationale: Queue policy is the access-control surface for messages.
      - id: CM-2
        title: Baseline Configuration
        rationale: Queue configuration change.
