schema_version: readtheplan-feedback-schema-v0
description: >
  Human feedback template generated by tools/scan_corpus.py for local corpus
  review. Keep feedback files local unless the associated scan bundle contains
  only synthetic, public-redacted, or minimized plan data.
fields:
  schema_version:
    required: true
    value: readtheplan-feedback-v0
  scan_id:
    required: true
    description: Stable identifier from metadata.json.
  reviewer:
    required: true
    fields:
      id:
        required: false
        description: Reviewer handle or email. Use a pseudonym for public corpora.
      role:
        required: false
        description: Reviewer context such as platform, security, sre, or audit.
  reviewed_at:
    required: false
    description: ISO 8601 timestamp filled by the reviewer or collection process.
  overall_human_risk:
    required: true
    enum: [safe, review, dangerous, irreversible]
  readtheplan_overall_risk:
    required: true
    enum: [safe, review, dangerous, irreversible]
  notes:
    required: false
    description: Free-form review notes.
  resource_feedback:
    required: true
    type: list
    fields:
      address:
        required: true
      resource_type:
        required: true
      readtheplan_risk:
        required: true
        enum: [safe, review, dangerous, irreversible]
      human_risk:
        required: false
        enum: [safe, review, dangerous, irreversible]
      issue_type:
        required: false
        enum:
          - correct
          - underclassified
          - overclassified
          - missed_resource
          - bad_explanation
          - missing_compliance_mapping
          - false_positive
          - parser_bug
          - output_usability
      expected_reason:
        required: false
        description: What the reviewer expected readtheplan to say.
      suggested_rule:
        required: false
        description: Optional rule idea. Do not implement rule changes in corpus PRs.
