[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "readtheplan"
version = "0.4.0"
description = "Local infrastructure risk analysis for Terraform, Kubernetes, cloud plans, CI pipelines, Docker Compose, and Nomad."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "texasich", email = "info@readtheplan.dev" }
]
keywords = ["terraform", "terraform-config", "terraform-lock", "terraform-state", "opentofu", "terragrunt", "pulumi", "cdk", "azure", "bicep", "azure-pipelines", "bitbucket-pipelines", "buildkite", "atlantis", "ansible", "ansible-project", "salt", "salt-project", "nix", "nixos", "dsc", "powershell-dsc", "cfengine", "opa", "rego", "conftest", "sentinel", "jenkins", "jenkins-jcasc", "chef", "chef-project", "puppet", "puppet-project", "kubernetes", "helm", "kustomize", "skaffold", "devspace", "tilt", "tiltfile", "cue", "cuelang", "jsonnet", "tanka", "jsonnet-bundler", "crossplane", "serverless", "sam", "docker-compose", "dockerfile", "nomad", "packer", "vagrant", "cloud-init", "systemd", "nginx", "haproxy", "envoy", "traefik", "caddy", "prometheus", "alertmanager", "grafana", "loki", "vault", "consul", "opentelemetry", "iac", "devops", "devsecops", "compliance", "plan", "review"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyYAML>=6.0",
  "python-hcl2>=7.0,<9.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://readtheplan.dev"
Documentation = "https://readtheplan.dev/docs/"
Repository = "https://github.com/readtheplan/readtheplan"
Issues = "https://github.com/readtheplan/readtheplan/issues"

[project.scripts]
readtheplan = "readtheplan.cli:main"

# Plugin entry point groups. External packages can contribute adapters and
# rules by declaring entry points in these groups; readtheplan discovers them at
# import via importlib.metadata. The builtins below are wired here as the
# canonical examples (discovery is idempotent).
[project.entry-points."readtheplan.adapters"]
ansible = "readtheplan.adapters.ansible:AnsibleAdapter"
ansible-project = "readtheplan.adapters.ansible_project:AnsibleProjectAdapter"
alertmanager = "readtheplan.adapters.monitoring:AlertmanagerAdapter"
atlantis = "readtheplan.adapters.atlantis:AtlantisAdapter"
azure = "readtheplan.adapters.azure:AzureWhatIfAdapter"
azure-pipelines = "readtheplan.adapters.pipelines:AzurePipelinesAdapter"
bitbucket-pipelines = "readtheplan.adapters.pipelines:BitbucketPipelinesAdapter"
bicep = "readtheplan.adapters.bicep:BicepAdapter"
buildkite = "readtheplan.adapters.pipelines:BuildkiteAdapter"
caddy = "readtheplan.adapters.caddy:CaddyAdapter"
chef = "readtheplan.adapters.chef:ChefAdapter"
chef-project = "readtheplan.adapters.chef_project:ChefProjectAdapter"
circleci = "readtheplan.adapters.pipelines:CircleCIAdapter"
cloudformation = "readtheplan.adapters.cloudformation:CloudFormationAdapter"
cdk = "readtheplan.adapters.cdk:CdkAdapter"
cloud-init = "readtheplan.adapters.cloud_init:CloudInitAdapter"
cfengine = "readtheplan.adapters.cfengine:CFEngineAdapter"
consul = "readtheplan.adapters.hashicorp:ConsulAdapter"
crossplane = "readtheplan.adapters.crossplane:CrossplaneAdapter"
docker-compose = "readtheplan.adapters.workloads:DockerComposeAdapter"
dockerfile = "readtheplan.adapters.dockerfile:DockerfileAdapter"
dsc = "readtheplan.adapters.dsc:DscAdapter"
devspace = "readtheplan.adapters.devspace:DevSpaceAdapter"
cue = "readtheplan.adapters.cue:CueAdapter"
jsonnet = "readtheplan.adapters.jsonnet:JsonnetAdapter"
tanka = "readtheplan.adapters.jsonnet:JsonnetAdapter"
envoy = "readtheplan.adapters.envoy:EnvoyAdapter"
grafana = "readtheplan.adapters.grafana:GrafanaAdapter"
github-actions = "readtheplan.adapters.pipelines:GitHubActionsAdapter"
gitlab-ci = "readtheplan.adapters.pipelines:GitLabCIAdapter"
haproxy = "readtheplan.adapters.proxy_configs:HAProxyAdapter"
jenkins = "readtheplan.adapters.jenkins:JenkinsAdapter"
jenkins-jcasc = "readtheplan.adapters.jenkins_jcasc:JenkinsJCasCAdapter"
helm = "readtheplan.adapters.helm:HelmAdapter"
kubernetes = "readtheplan.adapters.kubernetes:KubernetesAdapter"
kustomize = "readtheplan.adapters.kustomize:KustomizeAdapter"
loki = "readtheplan.adapters.loki:LokiAdapter"
nomad = "readtheplan.adapters.workloads:NomadPlanAdapter"
otel-collector = "readtheplan.adapters.otel_collector:OTelCollectorAdapter"
nginx = "readtheplan.adapters.proxy_configs:NginxAdapter"
packer = "readtheplan.adapters.packer:PackerInspectAdapter"
pulumi = "readtheplan.adapters.pulumi:PulumiAdapter"
pulumi-project = "readtheplan.adapters.pulumi_project:PulumiProjectAdapter"
prometheus = "readtheplan.adapters.monitoring:PrometheusAdapter"
puppet = "readtheplan.adapters.puppet:PuppetAdapter"
puppet-project = "readtheplan.adapters.puppet_project:PuppetProjectAdapter"
salt = "readtheplan.adapters.salt:SaltAdapter"
salt-project = "readtheplan.adapters.salt_project:SaltProjectAdapter"
nix = "readtheplan.adapters.nix:NixProjectAdapter"
opa = "readtheplan.adapters.opa:OPAAdapter"
sentinel = "readtheplan.adapters.sentinel:SentinelAdapter"
skaffold = "readtheplan.adapters.skaffold:SkaffoldAdapter"
sam = "readtheplan.adapters.serverless:SamTemplateAdapter"
serverless = "readtheplan.adapters.serverless:ServerlessFrameworkAdapter"
systemd = "readtheplan.adapters.systemd:SystemdUnitAdapter"
terraform-config = "readtheplan.adapters.terraform_config:TerraformConfigAdapter"
terraform-lock = "readtheplan.adapters.terraform_lock:TerraformLockAdapter"
terraform-state = "readtheplan.adapters.terraform_state:TerraformStateAdapter"
tilt = "readtheplan.adapters.tiltfile:TiltfileAdapter"
terragrunt = "readtheplan.adapters.terraform_config:TerragruntAdapter"
traefik = "readtheplan.adapters.traefik:TraefikAdapter"
vagrant = "readtheplan.adapters.vagrant:VagrantAdapter"
vault = "readtheplan.adapters.hashicorp:VaultAdapter"

[project.entry-points."readtheplan.rules"]
aws = "readtheplan.rules.aws"
gcp = "readtheplan.rules.gcp"
azure = "readtheplan.rules.azure"
cloudflare = "readtheplan.rules.cloudflare"
datadog = "readtheplan.rules.datadog"
grafana = "readtheplan.rules.grafana"
github = "readtheplan.rules.github"
gitlab = "readtheplan.rules.gitlab"
k8s = "readtheplan.rules.k8s"
newrelic = "readtheplan.rules.newrelic"
pagerduty = "readtheplan.rules.pagerduty"
tfe = "readtheplan.rules.tfe"
vault = "readtheplan.rules.vault"

[project.optional-dependencies]
mcp = ["mcp>=1.0.0,<2.0.0; python_version >= '3.10'"]
sign = ["sigstore>=4.0,<5"]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.5"]

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.package-data]
readtheplan = ["data/controls/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["src/readtheplan"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 78
show_missing = true

[tool.pytest.ini_options]
addopts = "--cov=readtheplan --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Broadened lint surface: pycodestyle errors (E), pyflakes (F), import sorting
# (I), and pyupgrade (UP). The previous unused-import / sorting backlog has been
# cleared with `ruff check --fix` plus manual fixes.
select = ["E", "F", "I", "UP"]
