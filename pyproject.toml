[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "readtheplan"
version = "0.3.0"
description = "Terraform plan risk explainer — reads `terraform plan` JSON and classifies each change as safe/review/dangerous/irreversible."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "texasich", email = "info@readtheplan.dev" }
]
keywords = ["terraform", "iac", "devops", "devsecops", "compliance", "plan", "review"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://readtheplan.dev"
Documentation = "https://readtheplan.dev/docs/"
Repository = "https://github.com/readtheplan/readtheplan"
Issues = "https://github.com/readtheplan/readtheplan/issues"

[project.scripts]
readtheplan = "readtheplan.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1.0.0,<2.0.0; python_version >= '3.10'"]
sign = ["sigstore>=4.0,<5"]
test = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.package-data]
readtheplan = ["data/controls/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["src/readtheplan"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 77
show_missing = true

[tool.pytest.ini_options]
addopts = "--cov=readtheplan --cov-report=term-missing"
testpaths = ["tests"]
