name: Site build and validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Python deps
        run: python -m pip install pyyaml

      - name: Install site dependencies
        run: npm ci --prefix site

      - name: Generate compliance data JSON
        run: python site/scripts/convert_data.py

      - name: Validate site source
        run: npm --prefix site test

      - name: Check classifier.js parity with Python rules
        run: node site/analysis/classifier-parity.test.js

      - name: Build static site
        run: npm --prefix site run build
