name: pytest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run pytest
        run: pytest

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image from checked-out source
        run: docker build --tag readtheplan:ci .

      - name: Verify source provenance and non-root runtime
        shell: bash
        run: |
          set -euo pipefail

          expected_package_sha="$(python3 scripts/hash_package_tree.py src/readtheplan)"
          actual_package_sha="$(
            docker run --rm --entrypoint python \
              --mount \
                type=bind,source="$PWD/scripts/hash_package_tree.py",target=/verify_package.py,readonly \
              readtheplan:ci /verify_package.py
          )"
          test "$actual_package_sha" = "$expected_package_sha"

          test "$(docker image inspect --format '{{.Config.User}}' readtheplan:ci)" = \
            "10001:10001"
          test "$(docker run --rm --entrypoint python readtheplan:ci -c \
            'import os; print(os.getuid())')" = "10001"

          docker run --rm --entrypoint python readtheplan:ci -m pip check
          docker run --rm readtheplan:ci --version
          docker run --rm readtheplan:ci >/dev/null

      - name: Analyze a plan without network or persistent writes
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount \
              type=bind,source="$PWD/tests/fixtures/valid_plan.json",target=/workspace/plan.json,readonly \
            readtheplan:ci analyze plan.json
