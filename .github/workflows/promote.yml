name: Promote signed Nexus release

on:
  # checkov:skip=CKV_GHA_7:The protected release tag is required and validated before use.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Protected v* GitHub Release whose signed evidence authorizes promotion.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nexus-promotion-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  promote:
    name: Verify durable evidence and promote exact Nexus inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: artifact-publish
    permissions:
      contents: read
    steps:
      - name: Check out trusted promotion verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate protected release tag input
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "::error::release_tag must be a protected v* release tag"
            exit 1
          fi
      - name: Download durable evidence from the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir release-assets
          test -f release-assets/nexus-release-manifest.json
          test -f release-assets/nexus-release-manifest.sigstore.json
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify tag-bound Nexus promotion authority
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          expected_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish.yml@refs/tags/$RELEASE_TAG"
          manifest_verify_args=(
            verify-blob
            --bundle release-assets/nexus-release-manifest.sigstore.json
            --certificate-identity "$expected_identity"
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
            release-assets/nexus-release-manifest.json
          )
          cosign "${manifest_verify_args[@]}"

          checksum_bundle="$(jq -r '.release_evidence.checksum_signature.asset // empty' release-assets/nexus-release-manifest.json)"
          if [[ -n "$checksum_bundle" ]]; then
            if [[ "$checksum_bundle" != "SHA256SUMS.sigstore.json" ]]; then
              echo "::error::Signed manifest contains an unexpected checksum bundle name"
              exit 1
            fi
            checksum_verify_args=(
              verify-blob
              --bundle "release-assets/$checksum_bundle"
              --certificate-identity "$expected_identity"
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
              release-assets/SHA256SUMS
            )
            cosign "${checksum_verify_args[@]}"
          fi
      - name: Verify signed source inventory and promote without rebuilding
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          NEXUS_BASE_URL: ${{ vars.NEXUS_STAGING_BASE_URL }}
          NEXUS_EXPECTED_HOST: ${{ vars.NEXUS_EXPECTED_HOST }}
          NEXUS_EXPECTED_PATH_PREFIX: ${{ vars.NEXUS_EXPECTED_PATH_PREFIX }}
          NEXUS_SOURCE_REPOSITORY: ${{ vars.NEXUS_STAGING_SOURCE_REPOSITORY }}
          NEXUS_DESTINATION_REPOSITORY: ${{ vars.NEXUS_STAGING_PROMOTION_TARGET }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          promote_args=(
            --manifest release-assets/nexus-release-manifest.json
            --release-assets-dir release-assets
            --expected-repository "$GITHUB_REPOSITORY"
            --expected-tag "$RELEASE_TAG"
            --expected-base-url "$NEXUS_BASE_URL"
            --expected-host "$NEXUS_EXPECTED_HOST"
            --expected-path-prefix "$NEXUS_EXPECTED_PATH_PREFIX"
            --expected-source-repository "$NEXUS_SOURCE_REPOSITORY"
            --expected-destination-repository "$NEXUS_DESTINATION_REPOSITORY"
          )
          python tools/nexus_release_evidence.py promote "${promote_args[@]}"
