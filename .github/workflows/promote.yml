name: Promote immutable Nexus artifact

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Nexus CE verifies a reference only; Nexus Pro may move the existing component.
        required: true
        type: choice
        default: nexus-ce-reference
        options:
          - nexus-ce-reference
          - nexus-pro-move
      source_repository:
        description: Source hosted repository; defaults to the repository in NEXUS_PYPI_REPOSITORY_URL.
        required: false
        type: string
        default: ""
      destination_repository:
        description: Nexus Pro destination; defaults to NEXUS_STAGING_PROMOTION_TARGET.
        required: false
        type: string
        default: ""
      component_tag:
        description: Optional Nexus Pro component tag; when empty, the exact SHA-256 is the move selector.
        required: false
        type: string
        default: ""
      component_path:
        description: Exact repository-relative immutable asset path to verify before and after promotion.
        required: true
        type: string
      sha256:
        description: Expected lowercase 64-character SHA-256 digest for component_path.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nexus-promotion-${{ inputs.destination_repository || vars.NEXUS_STAGING_PROMOTION_TARGET || 'verify-only' }}
  cancel-in-progress: false

jobs:
  promote:
    name: Verify and promote existing Nexus component
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: artifact-publish
    permissions:
      contents: read
    steps:
      - name: Validate immutable reference and Nexus configuration
        id: nexus
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          INPUT_SOURCE: ${{ inputs.source_repository }}
          INPUT_DESTINATION: ${{ inputs.destination_repository }}
          COMPONENT_TAG: ${{ inputs.component_tag }}
          COMPONENT_PATH: ${{ inputs.component_path }}
          COMPONENT_SHA256: ${{ inputs.sha256 }}
          NEXUS_STAGING_BASE_URL: ${{ vars.NEXUS_STAGING_BASE_URL }}
          NEXUS_STAGING_SOURCE_REPOSITORY: ${{ vars.NEXUS_STAGING_SOURCE_REPOSITORY }}
          NEXUS_STAGING_PROMOTION_TARGET: ${{ vars.NEXUS_STAGING_PROMOTION_TARGET }}
          NEXUS_PYPI_REPOSITORY_URL: ${{ vars.NEXUS_PYPI_REPOSITORY_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$NEXUS_USERNAME" || -z "$NEXUS_PASSWORD" ]]; then
            echo "::error::NEXUS_USERNAME and NEXUS_PASSWORD are required"
            exit 1
          fi

          publish_url="${NEXUS_PYPI_REPOSITORY_URL%/}"
          parsed_source=""
          parsed_base=""
          if [[ "$publish_url" =~ ^https://.+/repository/[A-Za-z0-9._-]+$ ]]; then
            parsed_source="${publish_url##*/}"
            parsed_base="${publish_url%/repository/$parsed_source}"
          fi

          base_url="${NEXUS_STAGING_BASE_URL%/}"
          source_repository="$INPUT_SOURCE"
          destination_repository="$INPUT_DESTINATION"
          [[ -n "$base_url" ]] || base_url="$parsed_base"
          [[ -n "$source_repository" ]] || source_repository="${NEXUS_STAGING_SOURCE_REPOSITORY:-$parsed_source}"
          [[ -n "$destination_repository" ]] || destination_repository="$NEXUS_STAGING_PROMOTION_TARGET"

          if [[ ! "$base_url" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::Set NEXUS_STAGING_BASE_URL (or a parseable NEXUS_PYPI_REPOSITORY_URL) to an HTTPS Nexus base URL"
            exit 1
          fi
          if [[ ! "$source_repository" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::source_repository must be a Nexus repository name"
            exit 1
          fi
          if [[ "$MODE" == "nexus-pro-move" && ! "$destination_repository" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Nexus Pro move requires destination_repository or NEXUS_STAGING_PROMOTION_TARGET"
            exit 1
          fi
          if [[ -n "$COMPONENT_TAG" && ! "$COMPONENT_TAG" =~ ^[A-Za-z0-9._:+-]+$ ]]; then
            echo "::error::component_tag contains unsupported characters"
            exit 1
          fi
          if [[ ! "$COMPONENT_PATH" =~ ^[A-Za-z0-9][A-Za-z0-9._/+~-]*$ || "$COMPONENT_PATH" == *"../"* || "$COMPONENT_PATH" == *"/.."* ]]; then
            echo "::error::component_path must be a safe repository-relative path without traversal, query, or fragment syntax"
            exit 1
          fi
          if [[ ! "$COMPONENT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::sha256 must be exactly 64 lowercase hexadecimal characters"
            exit 1
          fi

          echo "base-url=$base_url" >> "$GITHUB_OUTPUT"
          echo "source=$source_repository" >> "$GITHUB_OUTPUT"
          echo "destination=$destination_repository" >> "$GITHUB_OUTPUT"
      - name: Download and verify the source asset digest
        shell: bash
        env:
          NEXUS_BASE_URL: ${{ steps.nexus.outputs.base-url }}
          SOURCE_REPOSITORY: ${{ steps.nexus.outputs.source }}
          COMPONENT_PATH: ${{ inputs.component_path }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          source_asset="$RUNNER_TEMP/nexus-source-asset"
          curl --fail --silent --show-error --location \
            --user "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
            "$NEXUS_BASE_URL/repository/$SOURCE_REPOSITORY/$COMPONENT_PATH" \
            --output "$source_asset"
          actual="$(sha256sum "$source_asset" | cut -d ' ' -f 1)"
          if [[ "$actual" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Source digest mismatch: expected $EXPECTED_SHA256, received $actual"
            exit 1
          fi
          echo "Verified source path and digest before any mutation." >> "$GITHUB_STEP_SUMMARY"

      - name: Move the existing component with Nexus Repository 3 Pro
        if: inputs.mode == 'nexus-pro-move'
        shell: bash
        env:
          NEXUS_BASE_URL: ${{ steps.nexus.outputs.base-url }}
          SOURCE_REPOSITORY: ${{ steps.nexus.outputs.source }}
          DESTINATION_REPOSITORY: ${{ steps.nexus.outputs.destination }}
          COMPONENT_TAG: ${{ inputs.component_tag }}
          COMPONENT_SHA256: ${{ inputs.sha256 }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/nexus-move-response.json"
          selector=(--data-urlencode "repository=$SOURCE_REPOSITORY")
          if [[ -n "$COMPONENT_TAG" ]]; then
            selector+=(--data-urlencode "tag=$COMPONENT_TAG")
          else
            selector+=(--data-urlencode "sha256=$COMPONENT_SHA256")
          fi
          curl --fail --silent --show-error \
            --request POST \
            --get \
            --user "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
            "${selector[@]}" \
            "$NEXUS_BASE_URL/service/rest/v1/staging/move/$DESTINATION_REPOSITORY" \
            --output "$response"
          jq . "$response" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the promoted asset has the identical digest
        if: inputs.mode == 'nexus-pro-move'
        shell: bash
        env:
          NEXUS_BASE_URL: ${{ steps.nexus.outputs.base-url }}
          DESTINATION_REPOSITORY: ${{ steps.nexus.outputs.destination }}
          COMPONENT_PATH: ${{ inputs.component_path }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          destination_asset="$RUNNER_TEMP/nexus-destination-asset"
          curl --fail --silent --show-error --location \
            --user "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
            "$NEXUS_BASE_URL/repository/$DESTINATION_REPOSITORY/$COMPONENT_PATH" \
            --output "$destination_asset"
          actual="$(sha256sum "$destination_asset" | cut -d ' ' -f 1)"
          if [[ "$actual" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Promoted digest mismatch: expected $EXPECTED_SHA256, received $actual"
            exit 1
          fi
          echo "Verified build-once/promote semantics: destination digest is unchanged." >> "$GITHUB_STEP_SUMMARY"

      - name: Record Nexus CE reference-only result
        if: inputs.mode == 'nexus-ce-reference'
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ steps.nexus.outputs.source }}
          COMPONENT_PATH: ${{ inputs.component_path }}
          COMPONENT_SHA256: ${{ inputs.sha256 }}
        run: |
          {
            echo "### Nexus Repository CE reference verification"
            echo
            echo "Nexus Repository CE does not provide the Pro staging-move operation."
            echo "The existing immutable reference was verified and was **not copied, uploaded, or rebuilt**:"
            echo "\`$SOURCE_REPOSITORY/$COMPONENT_PATH@sha256:$COMPONENT_SHA256\`"
            echo
            echo "Promote this reference by updating the consuming environment/GitOps configuration after its protected approval."
          } >> "$GITHUB_STEP_SUMMARY"
