name: Publish Python package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Prepare release evidence
        shell: bash
        run: mkdir -p release-evidence

      - name: Generate release SPDX JSON with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: release-evidence/readtheplan.spdx.json
          syft-version: v1.48.0
          upload-artifact: false
          upload-release-assets: false

      - name: Create immutable release checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.whl *.tar.gz) > release-evidence/SHA256SUMS
          (cd dist && sha256sum --check ../release-evidence/SHA256SUMS)

      - name: Upload release evidence separately from PyPI files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-evidence
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build artifact
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.3
        with:
          persist-credentials: false

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          notes_args=(--generate-notes)

          if NOTES_FILE="$notes_file" python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v") or len(tag) == 1:
              print(f"unsupported release tag: {tag!r}", file=sys.stderr)
              raise SystemExit(1)

          version = tag[1:]
          raw = Path("CHANGELOG.md").read_bytes()
          try:
              lines = raw.decode("utf-8").splitlines(keepends=True)
          except UnicodeDecodeError as exc:
              print(f"CHANGELOG.md is not UTF-8: {exc}", file=sys.stderr)
              raise SystemExit(1) from exc

          matches = []
          for index, line in enumerate(lines):
              heading = line.rstrip("\r\n")
              if not heading.startswith("## ["):
                  continue
              close = heading.find("]", 4)
              if close >= 0 and heading[4:close] == version:
                  matches.append(index)

          if len(matches) != 1:
              print(
                  f"expected one CHANGELOG section for {version!r}; "
                  f"found {len(matches)}",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          start = matches[0]
          end = next(
              (
                  index
                  for index in range(start + 1, len(lines))
                  if lines[index].startswith("## ")
              ),
              len(lines),
          )
          section = "".join(lines[start:end])
          if not "".join(lines[start + 1 : end]).strip():
              print(f"CHANGELOG section for {version!r} is empty", file=sys.stderr)
              raise SystemExit(1)

          Path(os.environ["NOTES_FILE"]).write_bytes(section.encode("utf-8"))
          PY

          then
            notes_args=(--notes-file "$notes_file")
          else
            echo "::warning::Could not extract CHANGELOG section for $GITHUB_REF_NAME; using generated notes"
          fi

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            "${notes_args[@]}"
  artifact-signing:
    name: Sign immutable release evidence
    if: ${{ vars.ENABLE_ARTIFACT_SIGNING == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: artifact-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download exact build files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Download exact release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-evidence
          path: release-evidence/
      - name: Verify package bytes before signing
        shell: bash
        run: (cd dist && sha256sum --check ../release-evidence/SHA256SUMS)
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Keylessly sign the immutable checksum manifest
        shell: bash
        run: cosign sign-blob --yes --bundle release-evidence/SHA256SUMS.sigstore.json release-evidence/SHA256SUMS
      - name: Upload signing evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-signatures-${{ github.ref_name }}
          path: release-evidence/SHA256SUMS.sigstore.json
          if-no-files-found: error

  nexus-publish:
    name: Publish exact Python artifacts to Nexus Repository
    if: ${{ vars.ENABLE_NEXUS_PUBLISH == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: artifact-publish
    permissions:
      contents: read
    steps:
      - name: Validate Nexus publishing configuration
        shell: bash
        env:
          NEXUS_URL: ${{ vars.NEXUS_PYPI_REPOSITORY_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$NEXUS_URL" =~ ^https://.+/repository/[A-Za-z0-9._-]+/?$ ]] || { echo "::error::NEXUS_PYPI_REPOSITORY_URL must be an HTTPS /repository/<name> endpoint"; exit 1; }
          [[ -n "$NEXUS_USERNAME" && -n "$NEXUS_PASSWORD" ]] || { echo "::error::NEXUS_USERNAME and NEXUS_PASSWORD are required"; exit 1; }
      - name: Download exact build files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Download and verify exact release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-evidence
          path: release-evidence/
      - name: Verify package bytes and publish without rebuilding
        shell: bash
        env:
          TWINE_REPOSITORY_URL: ${{ vars.NEXUS_PYPI_REPOSITORY_URL }}
          TWINE_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check ../release-evidence/SHA256SUMS)
          python -m pip install --disable-pip-version-check "twine==6.2.0"
          python -m twine upload --non-interactive --disable-progress-bar dist/*.whl dist/*.tar.gz
          echo "Published the exact build artifact; Nexus must be configured with redeploy disabled." >> "$GITHUB_STEP_SUMMARY"
