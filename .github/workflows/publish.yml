name: Publish Python package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Upload build artifact
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          notes_args=(--generate-notes)

          if NOTES_FILE="$notes_file" python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v") or len(tag) == 1:
              print(f"unsupported release tag: {tag!r}", file=sys.stderr)
              raise SystemExit(1)

          version = tag[1:]
          raw = Path("CHANGELOG.md").read_bytes()
          try:
              lines = raw.decode("utf-8").splitlines(keepends=True)
          except UnicodeDecodeError as exc:
              print(f"CHANGELOG.md is not UTF-8: {exc}", file=sys.stderr)
              raise SystemExit(1) from exc

          matches = []
          for index, line in enumerate(lines):
              heading = line.rstrip("\r\n")
              if not heading.startswith("## ["):
                  continue
              close = heading.find("]", 4)
              if close >= 0 and heading[4:close] == version:
                  matches.append(index)

          if len(matches) != 1:
              print(
                  f"expected one CHANGELOG section for {version!r}; "
                  f"found {len(matches)}",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          start = matches[0]
          end = next(
              (
                  index
                  for index in range(start + 1, len(lines))
                  if lines[index].startswith("## ")
              ),
              len(lines),
          )
          section = "".join(lines[start:end])
          if not "".join(lines[start + 1 : end]).strip():
              print(f"CHANGELOG section for {version!r} is empty", file=sys.stderr)
              raise SystemExit(1)

          Path(os.environ["NOTES_FILE"]).write_bytes(section.encode("utf-8"))
          PY
          then
            notes_args=(--notes-file "$notes_file")
          else
            echo "::warning::Could not extract CHANGELOG section for $GITHUB_REF_NAME; using generated notes"
          fi

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            "${notes_args[@]}"
