name: hosted-security-gates

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "docs/adr/0013-hosted-analyzer-data-handling-boundary.md"
      - "docs/security/**"
      - "tests/hosted_security/**"
      - ".github/workflows/hosted-security-gates.yml"
      - "SECURITY.md"
      - "README.md"

permissions:
  contents: read

jobs:
  hosted-security-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Verify required hosted-security docs exist
        run: |
          required=(
            "docs/security/hosted-analyzer-release-gates.md"
            "docs/security/threat-model-hosted-analyzer.md"
            "docs/security/incident-response-hosted-data.md"
          )
          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file" >&2
              exit 1
            fi
          done

      - name: Run hosted security gate tests
        run: |
          pytest tests/hosted_security -q --no-cov

      - name: Generate hosted security gate report
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          report = {
            "generated_at": datetime.now(timezone.utc).isoformat(),
            "gate": "hosted-security-gates",
            "status": "pass",
            "checks": [
              "required-docs-present",
              "hosted-security-tests-pass"
            ]
          }
          with open("hosted-security-gate-report.json", "w", encoding="utf-8") as f:
            json.dump(report, f, indent=2)
          print("wrote hosted-security-gate-report.json")
          PY

      - name: Upload hosted security gate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-security-gate-report
          path: hosted-security-gate-report.json
