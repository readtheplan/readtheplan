name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://readtheplan.dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: python -m pip install "PyYAML>=6,<7"

      - name: Install site dependencies
        working-directory: site
        run: npm ci --ignore-scripts

      - name: Test site
        working-directory: site
        run: npm test

      - name: Test browser classifier parity
        working-directory: site
        run: node analysis/classifier-parity.test.js

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Record exact deployment commit
        working-directory: site
        run: printf '%s\n' "$GITHUB_SHA" > dist/_deployment-commit.txt

      - name: Deploy chat rate limiter
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.110.0 deploy
          --config workers/chat-rate-limiter/wrangler.toml

      - name: Download current Pages configuration
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test ! -e wrangler.toml
          test ! -e wrangler.json
          test ! -e wrangler.jsonc
          npx --yes wrangler@4.110.0 pages download config readtheplan --force

      - name: Prepare Pages configuration
        working-directory: site
        run: |
          python scripts/prepare-pages-config.py wrangler.toml wrangler.json
          rm -- wrangler.toml

      - name: Deploy production
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.110.0 pages deploy
          --project-name=readtheplan
          --branch=main
          --commit-hash="${GITHUB_SHA}"
          --commit-dirty=true

      - name: Verify exact production deployment
        working-directory: site
        run: |
          set -euo pipefail

          fetch_live() {
            local url="$1"
            local output="$2"
            rm -f -- "$output" || return 1
            curl --fail --silent --show-error --location --compressed \
              --connect-timeout 5 --max-time 10 --max-filesize 5242880 \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --output "$output" "$url"
          }

          verify_live() {
            local attempt="$1"
            local query="commit=${GITHUB_SHA}&attempt=${attempt}"
            fetch_live \
              "https://readtheplan.dev/_deployment-commit.txt?${query}" \
              "$RUNNER_TEMP/live-deployment-commit.txt" || return 1
            cmp --silent \
              dist/_deployment-commit.txt \
              "$RUNNER_TEMP/live-deployment-commit.txt" || return 1

            fetch_live \
              "https://readtheplan.dev/modern.css?${query}" \
              "$RUNNER_TEMP/live-modern.css" || return 1
            cmp --silent dist/modern.css "$RUNNER_TEMP/live-modern.css" || return 1

            fetch_live \
              "https://readtheplan.dev/chat/chat.js?${query}" \
              "$RUNNER_TEMP/live-chat.js" || return 1
            cmp --silent dist/chat/chat.js "$RUNNER_TEMP/live-chat.js" || return 1
          }

          for attempt in $(seq 1 24); do
            if verify_live "$attempt"; then
              printf 'Verified production commit %s and exact static assets.\n' "$GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done

          printf 'Production did not converge to commit %s within the verification window.\n' \
            "$GITHUB_SHA" >&2
          exit 1

      - name: Remove downloaded configuration
        if: always()
        working-directory: site
        run: rm -f -- wrangler.toml wrangler.json wrangler.jsonc
