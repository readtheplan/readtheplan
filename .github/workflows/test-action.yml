name: Test GitHub Action

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run action on valid plan
        id: valid
        uses: ./
        with:
          plan-file: tests/fixtures/valid_plan.json
          fail-on-any-change: "false"

      - name: Assert valid action outputs
        shell: bash
        env:
          SUMMARY_JSON: ${{ steps.valid.outputs['summary-json'] }}
          RESOURCE_CHANGE_COUNT: ${{ steps.valid.outputs['resource-change-count'] }}
          ACTION_COUNTS: ${{ steps.valid.outputs['action-counts'] }}
          RISK_COUNTS: ${{ steps.valid.outputs['risk-counts'] }}
        run: |
          set -euo pipefail

          test "$RESOURCE_CHANGE_COUNT" = "3"
          test "$ACTION_COUNTS" = '{"create":1,"delete/create":1,"update":1}'
          test "$RISK_COUNTS" = '{"dangerous":1,"review":1,"safe":1}'

          python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["SUMMARY_JSON"])
          assert payload["resource_change_count"] == 3
          assert payload["actions"]["delete/create"] == 1
          assert payload["risks"]["dangerous"] == 1
          assert payload["changes"][0]["address"] == "aws_s3_bucket.logs"
          PY

      - name: Run action on Pulumi preview
        id: pulumi
        uses: ./
        with:
          tool: pulumi
          input-file: tests/fixtures/pulumi_preview_mixed.json
          framework: soc2

      - name: Assert Pulumi action outputs
        shell: bash
        env:
          SUMMARY_JSON: ${{ steps.pulumi.outputs['summary-json'] }}
          CHANGE_COUNT: ${{ steps.pulumi.outputs['change-count'] }}
          ACTION_COUNTS: ${{ steps.pulumi.outputs['action-counts'] }}
          RISK_COUNTS: ${{ steps.pulumi.outputs['risk-counts'] }}
        run: |
          set -euo pipefail

          test "$CHANGE_COUNT" = "3"
          test "$ACTION_COUNTS" = '{}'
          test "$RISK_COUNTS" = '{"dangerous":1,"irreversible":1,"review":0,"safe":1}'

          python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["SUMMARY_JSON"])
          assert payload["adapter"] == "pulumi"
          assert payload["decision"] == "block"
          assert payload["total_changes"] == 3
          assert any(item.startswith("rtp.control.soc2.") for item in payload["required_checks"])
          PY

      - name: Reject unsupported tool
        id: unsupported_tool
        uses: ./
        continue-on-error: true
        with:
          tool: unsupported
          input-file: tests/fixtures/valid_plan.json

      - name: Assert unsupported tool failed
        if: ${{ steps.unsupported_tool.outcome != 'failure' }}
        shell: bash
        run: |
          echo "Expected unsupported tool validation to fail"
          exit 1

      - name: Run action on GitHub Actions workflow
        id: github_actions
        uses: ./
        with:
          tool: github-actions
          input-file: tests/fixtures/github_actions_deploy.yml
          framework: soc2

      - name: Assert GitHub Actions workflow outputs
        shell: bash
        env:
          SUMMARY_JSON: ${{ steps.github_actions.outputs['summary-json'] }}
          CHANGE_COUNT: ${{ steps.github_actions.outputs['change-count'] }}
          RISK_COUNTS: ${{ steps.github_actions.outputs['risk-counts'] }}
        run: |
          set -euo pipefail

          test "$CHANGE_COUNT" = "4"
          test "$RISK_COUNTS" = '{"dangerous":1,"irreversible":0,"review":2,"safe":1}'
          python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["SUMMARY_JSON"])
          assert payload["adapter"] == "github-actions"
          assert payload["decision"] == "block"
          assert "rtp.control.soc2.CC8.1" in payload["required_checks"]
          PY

      - name: Run action on Docker Compose
        id: docker_compose
        uses: ./
        with:
          tool: docker-compose
          input-file: tests/fixtures/docker_compose_risky.yml
          framework: soc2

      - name: Assert Docker Compose outputs
        shell: bash
        env:
          SUMMARY_JSON: ${{ steps.docker_compose.outputs['summary-json'] }}
          CHANGE_COUNT: ${{ steps.docker_compose.outputs['change-count'] }}
          RISK_COUNTS: ${{ steps.docker_compose.outputs['risk-counts'] }}
        run: |
          set -euo pipefail

          test "$CHANGE_COUNT" = "12"
          test "$RISK_COUNTS" = '{"dangerous":9,"irreversible":0,"review":1,"safe":2}'
          python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["SUMMARY_JSON"])
          assert payload["adapter"] == "docker-compose"
          assert payload["decision"] == "block"
          assert "rtp.control.soc2.CC8.1" in payload["required_checks"]
          PY

      - name: Run action on Nomad plan
        id: nomad
        uses: ./
        with:
          tool: nomad
          input-file: tests/fixtures/nomad_plan_risky.json
          framework: soc2

      - name: Assert Nomad outputs
        shell: bash
        env:
          SUMMARY_JSON: ${{ steps.nomad.outputs['summary-json'] }}
          CHANGE_COUNT: ${{ steps.nomad.outputs['change-count'] }}
          RISK_COUNTS: ${{ steps.nomad.outputs['risk-counts'] }}
        run: |
          set -euo pipefail

          test "$CHANGE_COUNT" = "10"
          test "$RISK_COUNTS" = '{"dangerous":6,"irreversible":0,"review":4,"safe":0}'
          python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["SUMMARY_JSON"])
          assert payload["adapter"] == "nomad"
          assert payload["decision"] == "block"
          assert "rtp.control.soc2.CC8.1" in payload["required_checks"]
          PY

      - name: Run action on Azure What-If
        id: azure
        uses: ./
        with:
          tool: azure
          input-file: tests/fixtures/azure_whatif_mixed.json
          framework: soc2

      - name: Assert Azure action outputs
        shell: bash
        env:
          SUMMARY_JSON: ${{ steps.azure.outputs['summary-json'] }}
          CHANGE_COUNT: ${{ steps.azure.outputs['change-count'] }}
          RISK_COUNTS: ${{ steps.azure.outputs['risk-counts'] }}
        run: |
          set -euo pipefail

          test "$CHANGE_COUNT" = "5"
          test "$RISK_COUNTS" = '{"dangerous":1,"irreversible":1,"review":2,"safe":1}'
          python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["SUMMARY_JSON"])
          assert payload["adapter"] == "azure"
          assert payload["decision"] == "block"
          assert "rtp.control.soc2.CC8.1" in payload["required_checks"]
          PY

      - name: Run action on Flux manifests
        id: flux
        uses: ./
        with:
          tool: kubernetes
          input-file: tests/fixtures/flux_gitops_risky.yml
          framework: soc2

      - name: Assert Flux outputs
        shell: bash
        env:
          SUMMARY_JSON: ${{ steps.flux.outputs['summary-json'] }}
          CHANGE_COUNT: ${{ steps.flux.outputs['change-count'] }}
          RISK_COUNTS: ${{ steps.flux.outputs['risk-counts'] }}
        run: |
          set -euo pipefail

          test "$CHANGE_COUNT" = "5"
          test "$RISK_COUNTS" = '{"dangerous":5,"irreversible":0,"review":0,"safe":0}'
          python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["SUMMARY_JSON"])
          assert payload["adapter"] == "kubernetes"
          assert payload["decision"] == "block"
          assert "rtp.control.soc2.CC8.1" in payload["required_checks"]
          PY

      - name: Run action on Packer inspect output
        id: packer
        uses: ./
        with:
          tool: packer
          input-file: tests/fixtures/packer_inspect_risky.txt
          framework: soc2

      - name: Assert Packer outputs
        shell: bash
        env:
          SUMMARY_JSON: ${{ steps.packer.outputs['summary-json'] }}
          CHANGE_COUNT: ${{ steps.packer.outputs['change-count'] }}
          RISK_COUNTS: ${{ steps.packer.outputs['risk-counts'] }}
        run: |
          set -euo pipefail

          test "$CHANGE_COUNT" = "11"
          test "$RISK_COUNTS" = '{"dangerous":5,"irreversible":0,"review":4,"safe":2}'
          python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["SUMMARY_JSON"])
          assert payload["adapter"] == "packer"
          assert payload["decision"] == "block"
          assert "rtp.control.soc2.CC8.1" in payload["required_checks"]
          PY

      - name: Run action on Salt states
        id: salt
        uses: ./
        with:
          tool: salt
          input-file: tests/fixtures/salt_states_risky.sls
          framework: soc2

      - name: Assert Salt outputs
        shell: bash
        env:
          SUMMARY_JSON: ${{ steps.salt.outputs['summary-json'] }}
          CHANGE_COUNT: ${{ steps.salt.outputs['change-count'] }}
          RISK_COUNTS: ${{ steps.salt.outputs['risk-counts'] }}
        run: |
          set -euo pipefail

          test "$CHANGE_COUNT" = "6"
          test "$RISK_COUNTS" = '{"dangerous":2,"irreversible":0,"review":3,"safe":1}'
          python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["SUMMARY_JSON"])
          assert payload["adapter"] == "salt"
          assert payload["decision"] == "block"
          assert "rtp.control.soc2.CC8.1" in payload["required_checks"]
          PY

      - name: Run action on Vagrantfile
        id: vagrant
        uses: ./
        with:
          tool: vagrant
          input-file: tests/fixtures/Vagrantfile.risky
          framework: soc2

      - name: Assert Vagrant outputs
        shell: bash
        env:
          SUMMARY_JSON: ${{ steps.vagrant.outputs['summary-json'] }}
          CHANGE_COUNT: ${{ steps.vagrant.outputs['change-count'] }}
          RISK_COUNTS: ${{ steps.vagrant.outputs['risk-counts'] }}
        run: |
          set -euo pipefail

          test "$CHANGE_COUNT" = "17"
          test "$RISK_COUNTS" = '{"dangerous":12,"irreversible":0,"review":5,"safe":0}'
          python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["SUMMARY_JSON"])
          assert payload["adapter"] == "vagrant"
          assert payload["decision"] == "block"
          assert "rtp.control.soc2.CC8.1" in payload["required_checks"]
          PY

      - name: Run action on cloud-init user-data
        id: cloud_init
        uses: ./
        with:
          tool: cloud-init
          input-file: tests/fixtures/cloud_init_risky.yml
          framework: soc2

      - name: Assert cloud-init outputs
        shell: bash
        env:
          SUMMARY_JSON: ${{ steps.cloud_init.outputs['summary-json'] }}
          CHANGE_COUNT: ${{ steps.cloud_init.outputs['change-count'] }}
          RISK_COUNTS: ${{ steps.cloud_init.outputs['risk-counts'] }}
        run: |
          set -euo pipefail

          test "$CHANGE_COUNT" = "20"
          test "$RISK_COUNTS" = '{"dangerous":11,"irreversible":0,"review":8,"safe":1}'
          python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["SUMMARY_JSON"])
          assert payload["adapter"] == "cloud-init"
          assert payload["decision"] == "block"
          assert "rtp.control.soc2.CC8.1" in payload["required_checks"]
          PY

      - name: Run action on Dockerfile
        id: dockerfile
        uses: ./
        with:
          tool: dockerfile
          input-file: tests/fixtures/Dockerfile.risky
          framework: soc2

      - name: Assert Dockerfile outputs
        shell: bash
        env:
          SUMMARY_JSON: ${{ steps.dockerfile.outputs['summary-json'] }}
          CHANGE_COUNT: ${{ steps.dockerfile.outputs['change-count'] }}
          RISK_COUNTS: ${{ steps.dockerfile.outputs['risk-counts'] }}
        run: |
          set -euo pipefail

          test "$CHANGE_COUNT" = "20"
          test "$RISK_COUNTS" = '{"dangerous":9,"irreversible":0,"review":10,"safe":1}'
          python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["SUMMARY_JSON"])
          assert payload["adapter"] == "dockerfile"
          assert payload["decision"] == "block"
          assert "rtp.control.soc2.CC8.1" in payload["required_checks"]
          PY

      - name: Fail on invalid plan JSON
        id: invalid
        uses: ./
        continue-on-error: true
        with:
          plan-file: tests/fixtures/invalid_plan.json

      - name: Assert invalid plan failed
        if: ${{ steps.invalid.outcome != 'failure' }}
        shell: bash
        run: |
          echo "Expected invalid plan analysis to fail"
          exit 1

      - name: Fail on missing plan file
        id: missing
        uses: ./
        continue-on-error: true
        with:
          plan-file: tests/fixtures/does-not-exist.json

      - name: Assert missing plan failed
        if: ${{ steps.missing.outcome != 'failure' }}
        shell: bash
        run: |
          echo "Expected missing plan file to fail"
          exit 1

      - name: Fail when changes are present and fail-on-any-change is true
        id: fail_on_changes
        uses: ./
        continue-on-error: true
        with:
          plan-file: tests/fixtures/valid_plan.json
          fail-on-any-change: "true"

      - name: Assert fail-on-any-change failed
        if: ${{ steps.fail_on_changes.outcome != 'failure' }}
        shell: bash
        run: |
          echo "Expected fail-on-any-change to fail for a plan with changes"
          exit 1

      - name: Fail on dangerous threshold
        id: fail_on_threshold
        uses: ./
        continue-on-error: true
        with:
          plan-file: tests/fixtures/valid_plan.json
          fail-on-threshold: "dangerous"

      - name: Assert fail-on-threshold failed
        if: ${{ steps.fail_on_threshold.outcome != 'failure' }}
        shell: bash
        run: |
          echo "Expected fail-on-threshold to fail for a dangerous plan"
          exit 1
