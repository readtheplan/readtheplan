authorization: {
  version: 1
  allow-header-cert-info: true
  rules: [
    {
      match-request: {
        path: "/"
        type: path
      }
      allow-unauthenticated: true
      sort-order: 1
      name: "fixture-unauthenticated-rule-do-not-leak"
    },
    {
      match-request: {
        path: "^/puppet-admin-api/v1/environment-cache"
        type: regex
        method: [delete, put]
      }
      allow: ["*"]
      sort-order: 200
      name: "fixture-admin-rule-do-not-leak"
    },
    {
      match-request: {
        path: "/status"
        type: path
        method: get
      }
      allow: [${?PUPPET_STATUS_CLIENT}]
      sort-order: 600
      name: "fixture-dynamic-rule-do-not-leak"
    }
  ]
}
include optional("fixture-extra-auth.conf")
