jruby-puppet: {
  compat-version: "2.0"
  ruby-load-path: [/srv/puppet/ruby]
  gem-home: /srv/puppet/gems
  gem-path: [/srv/puppet/gems, /tmp/fixture-gems]
  environment-vars: {
    PATH: "/tmp/fixture-bin"
    FIXTURE_API_TOKEN: "fixture-jruby-token-do-not-leak"
    SAFE_EXTERNAL: ${?SAFE_EXTERNAL}
  }
  max-active-instances: 16
  max-requests-per-instance: 0
  multithreaded: true
}
