[defaults]
host_key_checking = False
remote_user = root
allow_world_readable_tmpfiles = True
allow_broken_conditionals = True
display_args_to_stdout = True
log_path = ./ansible.log
vault_password_file = ./.vault-password
private_key_file = ./production-key
inventory = ./inventory.py
action_plugins = ./plugins/action
callback_plugins = ./plugins/callback
callbacks_enabled = http_post
stdout_callback = json
roles_path = ./roles
collections_paths = ./collections

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="sh -c ./proxy.sh"

[inventory]
enable_plugins = host_list, script, auto, yaml, custom_inventory

[galaxy]
server_list = private_hub

[galaxy_server.private_hub]
url = http://automation-hub.example.test/api/galaxy/
token = literal-hub-token
validate_certs = False
