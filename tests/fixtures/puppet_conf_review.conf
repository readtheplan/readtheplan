[main]
server = primary.internal.example
certname = agent.internal.example
certificate_revocation = chain
digest_algorithm = sha256

[server]
autosign = $confdir/autosign.conf
reports = puppetdb
storeconfigs = true
storeconfigs_backend = puppetdb
dns_alt_names = puppet,puppet.internal.example

[agent]
pluginsync = true
usecacheonfailure = true
runinterval = 30m
splay = true
noop = true
