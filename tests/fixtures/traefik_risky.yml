entryPoints:
  web:
    address: ":80"
    forwardedHeaders:
      insecure: true
  websecure:
    address: "0.0.0.0:443"
providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: true
    tls:
      insecureSkipVerify: true
  kubernetesCRD:
    allowCrossNamespace: true
    allowExternalNameServices: true
api:
  dashboard: true
  insecure: true
certificatesResolvers:
  letsencrypt:
    acme:
      email: ops@example.test
      storage: /var/lib/traefik/acme.json
      dnsChallenge:
        provider: cloudflare
experimental:
  plugins:
    example:
      moduleName: github.com/example/traefik-plugin
      version: v0.1.0
metrics:
  prometheus: {}
http:
  routers:
    public:
      rule: Host(`example.test`)
      entryPoints: [websecure]
      middlewares: [auth, cors]
      service: application
      tls:
        certResolver: letsencrypt
  middlewares:
    auth:
      basicAuth:
        users: ["admin:fixture-hash"]
    external-auth:
      forwardAuth:
        address: https://auth.example.test/verify
        tls:
          insecureSkipVerify: true
    cors:
      headers:
        accessControlAllowOriginList: ["*"]
  services:
    application:
      loadBalancer:
        servers:
          - url: http://10.0.0.10:8080
tls:
  certificates:
    - certFile: /etc/traefik/tls/site.crt
      keyFile: /etc/traefik/tls/site.key
  options:
    legacy:
      minVersion: VersionTLS10
