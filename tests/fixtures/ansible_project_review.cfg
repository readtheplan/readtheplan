[defaults]
host_key_checking = True
remote_user = deploy
inventory = ./inventory/hosts.yml
roles_path = ./roles
collections_paths = ./collections

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True

[inventory]
enable_plugins = host_list, yaml, ini, toml

[galaxy]
server_list = private_hub

[galaxy_server.private_hub]
url = https://automation-hub.example.test/api/galaxy/
token = ${ANSIBLE_GALAXY_TOKEN}
validate_certs = True
