apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-and-push
spec:
  workspaces:
    - name: source
  steps:
    - name: build
      image: docker:27
      script: |
        docker build -t "$IMAGE" .
        docker push "$IMAGE"
      env:
        - name: REGISTRY_TOKEN
          valueFrom:
            secretKeyRef:
              name: registry
              key: token
      volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker.sock
  sidecars:
    - name: docker
      image: docker:27-dind
      securityContext:
        privileged: true
  volumes:
    - name: docker-socket
      hostPath:
        path: /var/run/docker.sock
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: release
spec:
  tasks:
    - name: deploy
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/example/catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: task/deploy.yaml
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: release-now
spec:
  pipelineRef:
    resolver: bundles
    params:
      - name: bundle
        value: ghcr.io/example/pipelines:latest
      - name: name
        value: release
      - name: kind
        value: pipeline
      - name: secret
        value: registry-auth
  taskRunTemplate:
    serviceAccountName: deployer
    podTemplate:
      hostNetwork: true
  workspaces:
    - name: credentials
      secret:
        secretName: production-credentials
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: github-webhook
spec:
  serviceAccountName: tekton-triggers
  triggers:
    - name: deploy
      interceptors:
        - ref:
            name: cel
      bindings:
        - ref: deploy-binding
      template:
        ref: deploy-template
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: deploy-template
spec:
  params:
    - name: revision
  resourceTemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: webhook-release-
      spec:
        pipelineRef:
          name: release
        params:
          - name: revision
            value: $(tt.params.revision)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: deploy-binding
spec:
  params:
    - name: revision
      value: $(body.after)
---
apiVersion: resolution.tekton.dev/v1beta1
kind: ResolutionRequest
metadata:
  name: remote-task
spec:
  params:
    - name: url
      value: http://catalog.example.test/task.yaml
