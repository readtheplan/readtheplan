global
  user root
  lua-load /etc/haproxy/auth.lua
  stats socket /run/haproxy/admin.sock mode 666 level admin
  ssl-server-verify none
  server-state-file /var/lib/haproxy/server-state
  setenv API_TOKEN fixture-token

defaults
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s

frontend public
  bind 0.0.0.0:443 ssl crt /etc/haproxy/tls/site.pem
  acl admin_path path_beg /admin
  http-request set-header Authorization fixture-token
  http-request use-service lua.auth if admin_path
  default_backend application

backend application
  server app1 app.internal.example:443 ssl verify none
  load-server-state-from-file global
  stats enable
