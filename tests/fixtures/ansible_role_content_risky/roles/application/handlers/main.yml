---
- name: fixture-handler-name-do-not-leak
  ansible.builtin.systemd:
    name: application
    state: restarted
  listen: fixture-handler-topic-do-not-leak

- name: refresh the controller cache
  ansible.builtin.command: /usr/local/bin/refresh-cache

- name: load dynamic handler work
  ansible.builtin.include_tasks: "{{ handler_variant }}.yml"

- name: report handler execution
  ansible.builtin.debug:
    msg: "{{ fixture-handler-message-do-not-leak }}"
  changed_when: true
  notify: fixture-recursive-notification-do-not-leak
