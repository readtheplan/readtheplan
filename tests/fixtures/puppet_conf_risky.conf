# Runtime configuration with intentionally risky values for adapter coverage.
[main]
server = primary.internal.example
certname = controller.internal.example
environment = production
http_proxy_password = fixture-puppet-proxy-password-do-not-leak
certificate_revocation = false
digest_algorithm = md5
http_debug = true
http_extra_headers = Authorization: Bearer fixture-puppet-header-token-do-not-leak
show_diff = true
use_cached_catalog = true
ignore_plugin_errors = true
strict_variables = false
preferred_serialization_format = pson
basemodulepath = /srv/puppet/modules:/opt/puppetlabs/puppet/modules

[server]
autosign = true
allow_duplicate_certs = true
node_terminus = exec
external_nodes = /usr/local/bin/classify-node
config_version = /usr/local/bin/catalog-version
trusted_external_command = /usr/local/bin/trusted-facts
reports = http, company_audit
reporturl = http://reports.internal.example/upload
storeconfigs = true
storeconfigs_backend = company_database
dns_alt_names = puppet,puppet.internal.example
ca_ttl = 10y

[agent]
prerun_command = /usr/local/bin/before-puppet
postrun_command = /usr/local/bin/after-puppet
pluginsync = true
usecacheonfailure = true
runinterval = 15m
tasks = true
manage_internal_file_permissions = false
