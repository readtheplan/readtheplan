services:
  api:
    image: ghcr.io/example/api:latest
    command: ./serve --port 8080
    privileged: true
    network_mode: host
    cap_add:
      - SYS_ADMIN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - api_token
    ports:
      - "8080:8080"
  worker:
    image: ghcr.io/example/worker@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    read_only: true
    cap_drop:
      - ALL

secrets:
  api_token:
    file: ./api-token.txt
