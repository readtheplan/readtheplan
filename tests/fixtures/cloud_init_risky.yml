## template: jinja
#cloud-config
package_update: true
packages:
  - nginx
  - curl
users:
  - default
  - name: deploy
    lock_passwd: false
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAITest deploy@example
ssh_pwauth: true
disable_root: false
ssh_keys:
  rsa_private: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    test-only-fixture
    -----END OPENSSH PRIVATE KEY-----
write_files:
  - path: /etc/sudoers.d/deploy
    permissions: "0440"
    content: deploy ALL=(ALL) NOPASSWD:ALL
  - path: /opt/app/config.yml
    permissions: "0644"
    content: "token: fixture-secret"
bootcmd:
  - [sh, -c, "iptables -F"]
runcmd:
  - curl https://example.test/install | sh
  - [systemctl, restart, nginx]
disk_setup:
  /dev/vdb:
    table_type: gpt
mounts:
  - [/dev/vdb1, /srv]
phone_home:
  url: https://example.test/callback/{{ v1.instance_id }}
power_state:
  mode: reboot
final_message: Ready after $UPTIME seconds
future_module:
  enabled: true
