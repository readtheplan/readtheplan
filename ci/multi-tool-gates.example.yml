# Example cross-tool GitHub Actions gate. Pin the action to a released tag or
# full commit SHA before production use.
name: infrastructure-risk-gates

on:
  pull_request:
    paths:
      - "infra/**"
      - "**/*.bicep"
      - "cdk.out/**"
      - "ansible/**"
      - "ansible.cfg"
      - "Jenkinsfile"
      - "jenkins.yaml"
      - "chef/**"
      - "puppet/**"
      - "Puppetfile"
      - "hiera.yaml"

permissions:
  contents: read

jobs:
  review-static-inputs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: bicep
            input: infra/main.bicep
          - tool: cdk
            input: cdk.out/manifest.json
          - tool: azure
            input: build/azure-whatif.json
          - tool: kubernetes
            input: build/rendered-kubernetes.yaml
          - tool: ansible
            input: ansible/site.yml
          - tool: ansible-project
            input: ansible/requirements.yml
          - tool: jenkins
            input: Jenkinsfile
          - tool: jenkins-jcasc
            input: jenkins.yaml
          - tool: jenkins-project
            input: jenkins/plugins.txt
          - tool: chef
            input: chef/recipes/default.rb
          - tool: chef-project
            input: chef/Policyfile.lock.json
          - tool: chef-project
            input: chef/client.rb
          - tool: puppet
            input: puppet/site.pp
          - tool: puppet-project
            input: puppet/Puppetfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: readtheplan/readtheplan@496c4a57b000b67bd53f480bb8b21a6a5baf8f10  # main (2026-08-19); the tool/input-file/framework inputs are not in v0.4.0 — switch to the first release that includes them
        with:
          tool: ${{ matrix.tool }}
          input-file: ${{ matrix.input }}
          framework: soc2
          fail-on-threshold: dangerous

  # Generate structured previews in the same trusted jobs that already hold
  # provider credentials, then gate the resulting local artifacts.
  review-pulumi-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11  # v2
      - name: Install Pulumi program dependencies
        run: npm ci
        working-directory: infra
      - name: Produce Pulumi preview JSON
        run: pulumi preview --stack organization/project/production --json > preview.json
        working-directory: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      - uses: readtheplan/readtheplan@496c4a57b000b67bd53f480bb8b21a6a5baf8f10  # main (2026-08-19); the tool/input-file/framework inputs are not in v0.4.0 — switch to the first release that includes them
        with:
          tool: pulumi
          input-file: infra/preview.json
          framework: soc2
          fail-on-threshold: dangerous
